<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamUnify for Xbox</title><link rel="stylesheet" href="tv.css"><script defer src="config.js"></script><script defer src="app.js"></script></head>
<body><header><strong>Stream<span>Unify</span></strong><nav aria-label="Main navigation"><button id="home">Discover</button><button id="watchlist">My watchlist</button><button id="services">My services</button><button id="account">Sign in</button><button id="help">Help</button></nav></header>
<main><section class="hero"><p class="eyebrow">YOUR NEXT WATCH STARTS HERE</p><h1>One search. Every stream.</h1><p>Find movies and shows across your streaming services.</p><form id="searchForm"><label class="sr-only" for="query">Search movies and TV shows</label><input id="query" type="search" maxlength="120" placeholder="Search movies and TV shows"><button type="submit">Search</button></form></section>
<section class="toolbar" aria-label="Filters"><button data-filter="all" aria-pressed="true">All titles</button><button data-filter="movie" aria-pressed="false">Movies</button><button data-filter="series" aria-pressed="false">TV shows</button><button data-filter="free" aria-pressed="false">Free options</button><button data-filter="mine" aria-pressed="false">On my services</button><button id="country" value="US" disabled>Country: United States</button></section>
<div class="section-head"><h2 id="heading">Discover</h2><p id="membership"></p></div><p id="status" role="status" aria-live="polite">Connecting to StreamUnify…</p><button id="retry" hidden>Try again</button><section id="results" class="results" aria-label="Titles"></section>
</main><footer><span>A Select · B Back · Directional pad / stick Navigate</span><span>StreamUnify helps you find content. Provider subscriptions are separate.</span></footer>
<dialog id="panel" aria-labelledby="panelTitle"><button id="closePanel" class="close" aria-label="Close">Close</button><h2 id="panelTitle"></h2><div id="panelBody"></div><p id="panelStatus" role="status" aria-live="polite"></p></dialog></body></html>
